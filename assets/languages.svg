<svg xmlns="http://www.w3.org/2000/svg" width="820" height="236" viewBox="0 0 820 236" role="img">
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.fade{opacity:0;animation:fade .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1}}
.fade-up{opacity:0;animation:fade-up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade-up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.metric-card{transform-box:fill-box;transform-origin:center;transition:transform .28s ease,filter .28s ease}
.metric-card:hover{transform:translateY(-4px);filter:url(#glow)}
.metric-card .metric-outline{transition:stroke-opacity .28s ease,stroke-width .28s ease}
.metric-card:hover .metric-outline{stroke-opacity:.95;stroke-width:2}
.project-card{opacity:0;animation:fade .65s ease forwards;transform-box:fill-box;transform-origin:center;transition:transform .25s ease,filter .25s ease}
.project-card:hover{transform:translateY(-3px);filter:url(#glow)}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
.metric-accent{animation:breathe 4.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fade,.fade-up{opacity:1;animation:none}.blink,.float,.metric-accent{animation:none}.metric-card,.project-card{transition:none}.metric-card:hover,.project-card:hover{transform:none;filter:none}}

</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50BD49" stop-opacity=".16"/><stop offset=".6" stop-color="#50BD49" stop-opacity=".03"/><stop offset="1" stop-color="#50BD49" stop-opacity=".08"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50BD49" stop-opacity=".8"/><stop offset=".5" stop-color="#50BD49" stop-opacity=".25"/><stop offset="1" stop-color="#50BD49" stop-opacity=".6"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="818" height="234" rx="16" fill="#002913"/>
<rect x="1" y="1" width="818" height="234" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
<text x="34" y="46" font-size="22" font-weight="700" fill="#50BD49" filter="url(#glow)">Most Used Languages</text>
<text x="34" y="68" font-size="12" fill="#50BD49" fill-opacity=".7">SAMPLE DATA — NOT LIVE</text>
<text x="786" y="46" font-size="12" fill="#50BD49" fill-opacity=".7" text-anchor="end">&gt; Percentage(%100)</text>
<g class="fade" style="animation-delay:0.20s">
<circle cx="44" cy="92" r="4" fill="#50BD49" fill-opacity="1"/>
<text x="58" y="96" font-size="13" font-weight="700" fill="#50BD49">JavaScript</text>
<rect x="180" y="86" width="546" height="8" rx="4" fill="#50BD49" fill-opacity=".15"/>
<rect x="180" y="86" width="0" height="8" rx="4" fill="#50BD49" fill-opacity="1"><animate attributeName="width" from="0" to="391.2" dur="1.1s" begin="0.5s" fill="freeze"/></rect>
<text x="786" y="96" font-size="12" fill="#50BD49" fill-opacity=".8" text-anchor="end">71.65%</text>
</g>
<g class="fade" style="animation-delay:0.30s">
<circle cx="44" cy="126" r="4" fill="#50BD49" fill-opacity="0.8"/>
<text x="58" y="130" font-size="13" font-weight="700" fill="#50BD49">HTML</text>
<rect x="180" y="120" width="546" height="8" rx="4" fill="#50BD49" fill-opacity=".15"/>
<rect x="180" y="120" width="0" height="8" rx="4" fill="#50BD49" fill-opacity="0.8"><animate attributeName="width" from="0" to="49.1" dur="1.1s" begin="0.5s" fill="freeze"/></rect>
<text x="786" y="130" font-size="12" fill="#50BD49" fill-opacity=".8" text-anchor="end">9%</text>
</g>
<g class="fade" style="animation-delay:0.40s">
<circle cx="44" cy="160" r="4" fill="#50BD49" fill-opacity="0.62"/>
<text x="58" y="164" font-size="13" font-weight="700" fill="#50BD49">CSS</text>
<rect x="180" y="154" width="546" height="8" rx="4" fill="#50BD49" fill-opacity=".15"/>
<rect x="180" y="154" width="0" height="8" rx="4" fill="#50BD49" fill-opacity="0.62"><animate attributeName="width" from="0" to="78.2" dur="1.1s" begin="0.5s" fill="freeze"/></rect>
<text x="786" y="164" font-size="12" fill="#50BD49" fill-opacity=".8" text-anchor="end">14.33%</text>
</g>
<g class="fade" style="animation-delay:0.50s">
<circle cx="44" cy="194" r="4" fill="#50BD49" fill-opacity="0.46"/>
<text x="58" y="198" font-size="13" font-weight="700" fill="#50BD49">EJS</text>
<rect x="180" y="188" width="546" height="8" rx="4" fill="#50BD49" fill-opacity=".15"/>
<rect x="180" y="188" width="0" height="8" rx="4" fill="#50BD49" fill-opacity="0.46"><animate attributeName="width" from="0" to="27.5" dur="1.1s" begin="0.5s" fill="freeze"/></rect>
<text x="786" y="198" font-size="12" fill="#50BD49" fill-opacity=".8" text-anchor="end">5.03%</text>
</g>
</svg>
